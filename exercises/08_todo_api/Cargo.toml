[package]
name = "stage08-todo-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.52.0", features = ["macros", "net", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1.0.150"
tower = { version = "0.5.2", features = ["util"] }
